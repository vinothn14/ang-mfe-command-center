[build]
  command = "npx nx build remote-tasks"
  publish = "dist/apps/remote-tasks/browser"

# Restrict remote CORS to the production shell origin
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://angular-mfe-command-center.netlify.app"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Allow preview deployments / local testing access for manifest entry
[[headers]]
  for = "/remoteEntry.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
